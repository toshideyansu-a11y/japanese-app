<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語 todo dia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff6ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #fff6ec; --fg: #2b2622; --muted: #85786c; --card: #ffffff; --line: #eedfcc;
  --red: #d7263d; --green: #1f9d55; --blue: #2f6fd6; --yellow: #ffd23f; --orange: #f08a24;
  --pink: #ffb7c5; --ink: #1c1a18; --shadow: 0 10px 30px rgba(120, 70, 30, .12);
  --mincho: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17140f; --fg: #f3ece3; --muted: #a99d90; --card: #241f19; --line: #3a3229; --ink: #f6efe6; --shadow: 0 10px 30px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--fg); min-height: 100vh; overflow-x: hidden;
  font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
  background:
    radial-gradient(circle at 15% -10%, rgba(255,183,197,.45), transparent 40%),
    radial-gradient(circle at 110% 20%, rgba(255,210,63,.25), transparent 35%),
    var(--bg);
  background-attachment: fixed;
}
#app { max-width: 520px; margin: 0 auto; }
button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: transform .12s ease; }
button:active { transform: scale(.96); }
button.link { background: none; border: none; padding: 8px 0; color: var(--blue); font-size: 1.05rem; }
button.icon { border: none; background: none; font-size: 1.4rem; padding: 6px; color: var(--muted); }
button.primary { background: linear-gradient(135deg, #e8384f, #c81d35); color: #fff; border: none; box-shadow: 0 8px 20px rgba(215,38,61,.35); }
button.big { width: 100%; padding: 18px; font-size: 1.2rem; font-weight: 800; margin: 12px 0; }
button.big span { display: block; font-size: .8rem; font-weight: 500; opacity: .85; }
button.danger { color: var(--red); }
.pulse { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 6px; }
.top h1 { margin: 0; font-size: 1.7rem; font-family: var(--mincho); }
.top h1 span { font-size: 1rem; color: var(--muted); font-weight: 500; font-family: -apple-system, sans-serif; }
.top.study span { color: var(--muted); font-size: .9rem; }
.levelbox { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); margin: 8px 0; }
.levelbox .lv { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.levelbox .rank { font-family: var(--mincho); color: var(--red); font-size: 1.1rem; }
.levelbox small { color: var(--muted); font-size: .8rem; }
.hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.stat { background: var(--card); border-radius: 16px; padding: 14px 6px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 1.8rem; }
.stat small { color: var(--muted); font-size: .8rem; }
.stat.fire.on b { animation: flicker 1.6s ease-in-out infinite; }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.08) rotate(-3deg); } }
.done { text-align: center; background: var(--card); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); line-height: 1.6; }
.done small { color: var(--muted); }
.daily { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); cursor: pointer; }
.daily-k { width: 84px; height: 84px; flex: none; background: repeating-linear-gradient(0deg, transparent 0 41px, var(--line) 41px 42px), repeating-linear-gradient(90deg, transparent 0 41px, var(--line) 41px 42px); border: 2px solid var(--red); border-radius: 10px; }
.daily small { display: block; color: var(--muted); font-size: .75rem; }
.daily b { display: block; font-size: 1.1rem; margin: 4px 0; }
.card-list { margin: 18px 0; }
.card-list h2, .form h2, .finish h2 { font-size: 1rem; margin: 18px 0 8px; }
.card-list p { color: var(--muted); font-size: .9rem; margin: 6px 0; }
.bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #39c27a, var(--green)); border-radius: 6px; transition: width .6s ease; }
.bar.xp i { background: linear-gradient(90deg, var(--yellow), var(--orange)); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row button { font-size: .95rem; padding: 14px 6px; box-shadow: var(--shadow); border: none; }
.tip { color: var(--muted); font-size: .85rem; line-height: 1.5; }
.tip.center { text-align: center; }
/* Estudo */
.sbar { flex: 1; height: 12px; background: var(--line); border-radius: 8px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--red)); border-radius: 8px; transition: width .4s ease; }
.combo { font-weight: 800; color: var(--orange); opacity: 0; transform: scale(.5); transition: all .3s cubic-bezier(.3,1.6,.5,1); min-width: 44px; text-align: right; }
.combo.show { opacity: 1; transform: scale(1); }
.tags { display: flex; gap: 6px; margin: 6px 0 2px; }
.tag { font-size: .75rem; padding: 3px 10px; border-radius: 20px; background: var(--card); color: var(--muted); box-shadow: var(--shadow); }
.tag.new { background: var(--yellow); color: #5a4300; }
.tag.type-kanji { background: #fde3e6; color: var(--red); }
.flash { position: relative; background: var(--card); border-radius: 22px; padding: 22px 18px; margin: 8px 0; min-height: 300px; box-shadow: var(--shadow); transform-origin: center; perspective: 800px; }
.flash::before { content: ""; position: absolute; inset: 8px; border: 1.5px dashed var(--line); border-radius: 16px; pointer-events: none; }
.flash.enter { animation: enter .35s cubic-bezier(.2,1.2,.4,1); }
@keyframes enter { from { opacity: 0; transform: translateX(40px) rotate(2deg); } to { opacity: 1; transform: none; } }
.flash.flip-out { animation: flipout .18s ease-in forwards; }
@keyframes flipout { to { transform: rotateY(90deg); } }
.flash.flip-in { animation: flipin .28s ease-out; }
@keyframes flipin { from { transform: rotateY(-90deg); } to { transform: none; } }
.flash.shake { animation: shake .45s ease; }
@keyframes shake { 20%,60% { transform: translateX(-10px) rotate(-1deg); } 40%,80% { transform: translateX(10px) rotate(1deg); } }
.flash.good { animation: goodout .4s ease-in forwards; }
@keyframes goodout { 30% { transform: scale(1.03); } to { opacity: 0; transform: translateY(-30px) scale(.95); } }
.kind { color: var(--muted); font-size: .85rem; text-align: center; position: relative; }
.big-kanji { font-family: var(--mincho); font-size: 8rem; text-align: center; line-height: 1.25; margin: 18px 0; color: var(--ink); animation: ink .6s ease-out; }
@keyframes ink { from { opacity: 0; filter: blur(6px); transform: scale(1.15); } to { opacity: 1; filter: none; transform: none; } }
.flash .jp { font-size: 2.3rem; text-align: center; margin: 40px 0 8px; animation: ink .5s ease-out; }
.flash .pt { font-size: 1.7rem; text-align: center; margin: 50px 0; animation: ink .5s ease-out; }
.meaning { font-size: 1.5rem; font-weight: 800; text-align: center; }
.r { color: var(--muted); text-align: center; }
.kanji-back { display: flex; gap: 14px; align-items: center; }
.stroke-box { flex: none; width: 140px; padding: 6px; border: 2px solid var(--red); border-radius: 14px; background:
  linear-gradient(var(--line), var(--line)) center/1px 100% no-repeat,
  linear-gradient(var(--line), var(--line)) center/100% 1px no-repeat, var(--card); }
.stroke-box small { display: block; color: var(--muted); font-size: .7rem; margin-top: 2px; }
.kb-info { flex: 1; }
.kb-info .meaning { text-align: left; }
.readings { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; color: var(--muted); }
.readings em { font-style: normal; font-size: .7rem; background: var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
svg.strokes { width: 100%; display: block; }
svg.strokes path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg.strokes .ghost path { stroke: var(--line); stroke-width: 4; }
svg.strokes .ink path { stroke: var(--ink); stroke-width: 4.5; }
.hint { position: relative; background: linear-gradient(135deg, rgba(255,210,63,.3), rgba(255,183,197,.3)); border-radius: 12px; padding: 10px 12px; margin: 14px 0; font-size: .95rem; }
.ex { list-style: none; padding: 0; margin: 10px 0 0; position: relative; }
.ex li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ex .r { text-align: left; }
.say { padding: 6px 9px; border-radius: 50%; font-size: .9rem; }
.sentence { position: relative; display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.jp-s { font-size: 1.1rem; }
.pt-s { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; animation: up .3s ease-out; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.g { padding: 14px 4px; font-weight: 800; color: #fff; border: none; box-shadow: 0 6px 14px rgba(0,0,0,.15); }
.g small { display: block; font-weight: 500; opacity: .9; font-size: .75rem; }
.g1 { background: linear-gradient(135deg, #ef5466, #c81d35); } .g2 { background: linear-gradient(135deg, #f7a24b, #e07a12); }
.g3 { background: linear-gradient(135deg, #3cc47e, #1a8a4a); } .g4 { background: linear-gradient(135deg, #5b93ef, #2559c2); }
/* Efeitos */
.petal { position: fixed; z-index: 50; width: 12px; height: 10px; background: radial-gradient(circle at 30% 30%, #fff, var(--pink) 60%, #f58aa3); border-radius: 12px 0 12px 0; pointer-events: none; animation: burst 1.3s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes burst { from { transform: translate(-50%,-50%) scale(.4); opacity: 1; } 70% { opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 60px)) rotate(var(--rot)) scale(1); opacity: 0; } }
.petal.fall { top: -20px; animation: fall linear forwards; }
@keyframes fall { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--sway), 105vh) rotate(540deg); opacity: .8; } }
.float { position: fixed; z-index: 60; transform: translate(-50%, 0); font-weight: 800; color: var(--orange); pointer-events: none; animation: floatup 1.1s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.12); }
.float.big { font-size: 1.6rem; color: var(--red); white-space: nowrap; }
@keyframes floatup { from { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } to { opacity: 0; transform: translate(-50%, -50px) scale(1); } }
/* Tela final */
.finish { text-align: center; padding-top: 40px; }
.otsukare { font-family: var(--mincho); font-size: 2.6rem; font-weight: 700; color: var(--red); animation: ink .8s ease-out; }
.finish .sub { color: var(--muted); }
.levelup { display: inline-block; margin: 10px 0; padding: 8px 18px; border-radius: 30px; background: linear-gradient(135deg, var(--yellow), var(--orange)); color: #4a2b00; font-weight: 800; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 6px 0 14px; }
.stamp { width: 64px; height: 64px; display: grid; place-items: center; font-family: var(--mincho); font-size: 2.2rem; color: var(--red); border: 3px solid var(--red); border-radius: 12px; transform: rotate(-6deg); background: rgba(215,38,61,.06); animation: stamp .45s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes stamp { from { opacity: 0; transform: scale(2.4) rotate(-20deg); } to { opacity: 1; transform: scale(1) rotate(-6deg); } }
/* Formulários */
.form label { display: block; margin: 12px 0; font-size: .9rem; color: var(--muted); }
.form label.check { display: flex; gap: 8px; align-items: center; color: var(--fg); font-size: 1rem; }
.form input, .form select { display: block; width: 100%; margin-top: 6px; padding: 12px; font-size: 1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.form label.check input { width: auto; margin: 0; }
.form button { display: block; width: 100%; margin: 8px 0; }
.form .file input { border: 1px dashed var(--line); }
.form a { color: var(--blue); }
.mine { list-style: none; padding: 0; }
.mine li { padding: 8px 0; border-top: 1px solid var(--line); }
/* Coleção */
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
.kc { position: relative; font-family: var(--mincho); font-size: 1.7rem; padding: 8px 2px; color: var(--muted); opacity: .55; animation: pop .35s ease both; }
.kc small { display: block; font-family: -apple-system, sans-serif; font-size: .6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kc.seen { border: 2px solid var(--blue); color: var(--fg); opacity: 1; }
.kc.ok { color: var(--fg); opacity: 1; border: 2px solid var(--red); }
.kc.ok::after { content: "覚"; position: absolute; top: -6px; right: -4px; width: 22px; height: 22px; display: grid; place-items: center; font-size: .8rem; color: #fff; background: var(--red); border-radius: 50%; transform: rotate(12deg); box-shadow: 0 2px 4px rgba(0,0,0,.2); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="strokes.js"></script>
<script src="app.js"></script>
</body>
</html>
